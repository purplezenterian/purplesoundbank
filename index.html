<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Purple SoundBank</title><style>:root{color-scheme:dark}html,body{margin:0}</style></head><body><title>Purple SoundBank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: black performance deck. An 8-pad sound screen on top, a row of knobs and switches under it, then the keyboard. Glow is reserved for what is active. */
:root {
  --bg: #050309;
  --panel: #0b0813;
  --pad: #100c1a;
  --pad-edge: #231a36;
  --field: #0e0a17;
  --line: #2a2142;
  --text: #ece6f7;
  --muted: #8a7fa3;
  --faint: #4d4463;
  --glow: #7b2fff;
  --glow-deep: #4c1d95;
  --glow-rgb: 123, 47, 255;
  --solo: #ffc94d;
  --key-white-top: #2d2744;
  --key-white-bot: #1c172e;
  --key-black-top: #0a0710;
  --key-black-bot: #000000;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 24px; height: 24px; border-radius: 7px; background: #000; border: 1px solid var(--glow); box-shadow: 0 0 12px rgba(var(--glow-rgb), .55), inset 0 0 8px rgba(var(--glow-rgb), .5); position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; bottom: 5px; width: 3px; border-radius: 2px; background: var(--glow); }
.mark::before { left: 6px; height: 8px; }
.mark::after { left: 13px; height: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }

.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; max-width: 100%; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); cursor: pointer; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.chip.ok { color: var(--text); border-color: var(--glow-deep); }
.chip.ok .dot { background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.chip .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { margin: 0; font-size: 12.5px; color: var(--solo); }

.deck { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.saved { position: absolute; top: -8px; right: 16px; padding: 0 6px; background: var(--bg); color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
.saved.show { opacity: 1; }
.saved::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.screen { background: #000; border: 1px solid var(--pad-edge); border-radius: 10px; padding: 6px; }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pad { position: relative; min-width: 0; height: 50px; padding: 0 4px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--pad-edge); background: var(--pad); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; text-align: center; }
.pad.empty { cursor: pointer; color: var(--faint); background: #07050c; border-color: #17112a; border-style: dashed; }
.pad { touch-action: manipulation; -webkit-touch-callout: none; }
.pad.lift { transform: scale(1.07); z-index: 5; border-color: #fff; box-shadow: 0 0 22px rgba(var(--glow-rgb), .9); }
.pad.target { outline: 2px dashed #d9c2ff; outline-offset: 2px; }
.chan.gone { display: none; }
#slotMenu { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-start; justify-content: center; padding-top: 70px; background: rgba(2,1,6,.72); }
#slotMenu.open { display: flex; }
#slotMenu .sheet { width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow: auto; background: #0b0813; border: 1px solid var(--glow); border-radius: 14px; padding: 12px; box-shadow: 0 0 30px rgba(var(--glow-rgb), .5); }
.chips { display: flex; gap: 8px; align-items: center; }
#daw-chip.rec .dot { background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
#daw-chip.lnk .dot { background: #4cf0a6; box-shadow: 0 0 8px #4cf0a6; }
#daw-chip.rec .txt::after { content: " · REC"; }
#dawMenu { position: fixed; inset: 0; z-index: 61; display: none; align-items: flex-start; justify-content: center; padding-top: 60px; background: rgba(2,1,6,.78); }
#dawMenu.open { display: flex; }
#dawMenu .sheet { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto; background: #0b0813; border: 1px solid var(--glow); border-radius: 14px; padding: 16px; box-shadow: 0 0 30px rgba(var(--glow-rgb), .5); }
#dawMenu h3 { margin: 0 0 10px; font: 700 11px var(--font-display, inherit); letter-spacing: .18em; text-transform: uppercase; color: #b79cff; }
#dawMenu .sub { margin: 14px 0 6px; font: 600 10px var(--font-display, inherit); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
#dawMenu p { margin: 0 0 8px; font: 12px/1.5 var(--font-display, inherit); color: #a894d8; }
#dawMenu .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
#dawMenu .big { flex: 1 1 140px; min-height: 40px; border-radius: 8px; border: 1px solid #3a2a63; background: #150f26; color: #e6d9ff; font: 700 12px var(--font-display, inherit); letter-spacing: .06em; cursor: pointer; padding: 0 12px; }
#dawMenu .big:hover { border-color: #9b5cff; background: #1d1438; }
#dawMenu .big.go { background: #6d2cf0; border-color: #9b5cff; color: #fff; }
#dawMenu .big.stop { background: #d6335a; border-color: #ff6b8a; color: #fff; }
#dawMenu .big[disabled] { opacity: .4; cursor: default; }
#dawMenu .stat { font: 600 12px var(--font-display, inherit); color: #cdb8ff; letter-spacing: .06em; }
#dawMenu .stat b { color: #fff; }
#dawMenu .x { float: right; background: none; border: 0; color: #8a73c8; font-size: 20px; cursor: pointer; line-height: 1; }
#slotMenu .psearch { position: sticky; top: -12px; z-index: 1; margin: -12px -12px 4px; padding: 12px 12px 8px; background: #0b0813; }
#slotMenu .psearch h3 { margin: 0 0 8px; }
#slotMenu h3 { margin: 0 0 8px; font: 700 11px var(--font-display, inherit); letter-spacing: .18em; text-transform: uppercase; color: #b79cff; }
#slotMenu .sub { margin: 10px 0 4px; font: 600 10px var(--font-display, inherit); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
#slotMenu .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 9px 8px; color: #cdb8ff; font: 600 13px var(--font-display, inherit); cursor: pointer; }
#slotMenu .opt:hover, #slotMenu .opt:active { background: rgba(var(--glow-rgb), .22); color: #fff; }
#slotMenu .opt small { color: #6b5a9a; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
#slotMenu .opt.rm { color: #ff8aa8; }
#slotMenu .opt.here { background: rgba(var(--glow-rgb), .28); color: #fff; }
.pname { font-size: 12.5px; font-weight: 500; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; word-break: break-word; }
.pstat { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--solo); min-height: 11px; }
.pad.on { color: #fff; border-color: var(--glow); background: radial-gradient(120% 140% at 50% 0%, rgba(var(--glow-rgb), .3), rgba(var(--glow-rgb), .06) 70%), var(--pad); box-shadow: 0 0 14px rgba(var(--glow-rgb), .45), inset 0 0 14px rgba(var(--glow-rgb), .3); }
.pad.on .pname { text-shadow: 0 0 10px rgba(var(--glow-rgb), .9); }
.pad.loading .pname { opacity: .55; }
.c { position: absolute; width: 11px; height: 11px; border: 0 solid var(--text); opacity: 0; pointer-events: none; }
.pad.focus .c { opacity: 1; }
.c.tl { top: 3px; left: 3px; border-top-width: 2px; border-left-width: 2px; }
.c.tr { top: 3px; right: 3px; border-top-width: 2px; border-right-width: 2px; }
.c.bl { bottom: 3px; left: 3px; border-bottom-width: 2px; border-left-width: 2px; }
.c.br { bottom: 3px; right: 3px; border-bottom-width: 2px; border-right-width: 2px; }

.row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 8px; }
.field { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.cap { font-size: 10.5px; color: var(--muted); max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbtn, .stepper { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); cursor: pointer; font-weight: 500; }
.fbtn { min-width: 70px; padding: 0 12px; }
.fbtn.on { border-color: var(--glow); color: #fff; box-shadow: 0 0 12px rgba(var(--glow-rgb), .45), inset 0 0 10px rgba(var(--glow-rgb), .35); }
#solo.on { border-color: var(--solo); color: var(--solo); box-shadow: 0 0 12px rgba(255, 201, 77, .3), inset 0 0 10px rgba(255, 201, 77, .15); }
.stepper { display: flex; align-items: stretch; overflow: hidden; cursor: default; }
.stepper button { width: 42px; border: 0; background: transparent; cursor: pointer; font-size: 18px; }
.stepper button:disabled { color: var(--faint); cursor: default; }
.stepper span { min-width: 78px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 500; font-variant-numeric: tabular-nums; border-inline: 1px solid var(--line); }


.adsr { display: flex; flex-direction: column; gap: 8px; }
.adsr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--field); min-width: 0; }
.seg button { height: 36px; padding: 0 12px; border: 0; background: transparent; cursor: pointer; font-weight: 500; font-size: 13px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.seg button.on { color: #fff; background: rgba(var(--glow-rgb), .28); box-shadow: inset 0 0 12px rgba(var(--glow-rgb), .55); }
.fbtn.small { height: 36px; min-width: 0; padding: 0 12px; font-size: 13px; }
.knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kcol { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.knob { width: 50px; height: 50px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
.knob svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ktrack, .kval { fill: none; stroke-width: 4; stroke-linecap: round; }
.ktrack { stroke: #231a36; }
.kval { stroke: var(--glow); filter: drop-shadow(0 0 4px rgba(var(--glow-rgb), .9)); }
.kbody { fill: #14101f; stroke: #2f2549; stroke-width: 1; }
.kdot { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
.kname { font-size: 10.5px; color: var(--muted); }

.mid { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "ctl aux adsr"; align-items: start; column-gap: 10px; row-gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.ctl { grid-area: ctl; }
.aux { flex: 1; align-content: center; display: grid; grid-template-columns: repeat(5, minmax(0, 56px)); justify-content: space-evenly; align-items: start; gap: 4px; min-width: 0; }
.mid .adsr { grid-area: adsr; }
.led { grid-area: aux; align-self: stretch; min-width: 0; position: relative; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 140% at 50% 0%, #150b2b 0%, #07040f 62%, #040208 100%); border: 1px solid #3a2a63; box-shadow: inset 0 0 34px rgba(var(--glow-rgb), .2), 0 0 16px rgba(var(--glow-rgb), .18); }
.led::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.led-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #b98cff; text-shadow: 0 0 8px rgba(var(--glow-rgb), .9); white-space: nowrap; }
.led-head .sub { color: #6c53a3; text-shadow: none; }
.lib { display: none; flex: 1; min-height: 0; gap: 8px; position: relative; z-index: 1; }
.mid.islib .lib { display: flex; }
.mid.islib .led-idle, .mid.islib .aux { display: none; }
.lib-cats, .lib-list { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #4a3580 transparent; }
.lib-cats { flex: 0 0 38%; max-width: 170px; border-right: 1px solid #2c1f52; padding-right: 6px; }
.lib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.lib-list { flex: 1; }
.lib-search { width: 100%; box-sizing: border-box; background: #0b0618; border: 1px solid #3a2a63; border-radius: 6px; color: #d9c2ff; font: 12px var(--font-display, inherit); letter-spacing: .08em; padding: 5px 8px; outline: none; }
.lib-search:focus { border-color: #9b5cff; box-shadow: 0 0 8px rgba(var(--glow-rgb), .5); }
.lib-row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 6px 8px; min-height: 30px; color: #9a82cf; font: 600 12px var(--font-display, inherit); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.lib-row:hover { background: rgba(var(--glow-rgb), .12); color: #d9c2ff; }
.lib-row.on { background: rgba(var(--glow-rgb), .28); color: #fff; text-shadow: 0 0 8px rgba(var(--glow-rgb), 1); }
.lib-row .n { color: #5b4690; font-size: 10px; }
.lib-row.dim { opacity: .45; }
.lib-row .nm { display: inline-flex; align-items: center; gap: 6px; }
.newtag { font-size: 11px; font-weight: 500; color: #fff; border: 1px solid var(--glow); border-radius: 6px; padding: 1px 6px; box-shadow: 0 0 10px rgba(var(--glow-rgb), .45), inset 0 0 8px rgba(var(--glow-rgb), .35); line-height: 1.3; }
.lib-row.locked { color: #b9a3ee; }
.lib-empty { padding: 10px 8px; color: #5b4690; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.led-idle { display: none; flex: 1; position: relative; min-height: 84px; }
.led-idle canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.led-idle .big { font-family: var(--font-display); font-weight: 600; font-size: clamp(18px, 3vw, 30px); letter-spacing: .14em; text-transform: uppercase; color: #c9a6ff; text-shadow: 0 0 14px rgba(var(--glow-rgb), 1), 0 0 34px rgba(var(--glow-rgb), .6); }
.led-idle .small { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #5b4690; }
.mid.noaux .led-idle { display: flex; }
.mid.noaux .aux { display: none; }
@media (max-width: 599px) {
  .mid { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ctl adsr" "aux aux"; }
  .mid .adsr { justify-self: end; width: 100%; max-width: 188px; }
}
.ctl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 138px; }
.ctl .fbtn { min-width: 0; height: 36px; padding: 0; font-size: 11px; }
.fbtn:disabled { color: var(--faint); cursor: default; }
.ctl .stepper { grid-column: 1 / -1; height: 36px; }
.ctl .stepper button { width: 32px; font-size: 16px; }
.ctl .stepper span { min-width: 0; flex: 1; font-size: 12px; white-space: nowrap; }
.ctl .pair { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ctl .pair:has(#mode-lib) { grid-template-columns: 1fr 1fr 1fr; }
.ctl .pair .fbtn { font-size: 12.5px; }
#undo, #redo { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.mid .adsr { width: 188px; min-width: 0; gap: 6px; }
.mid .adsr-top { gap: 6px; }
.mid .seg { flex: 1 1 auto; min-width: 0; }
.mid .seg button { min-width: 0; }
.mid .seg #tgt-one { flex: 1 1 auto; }
.mid .fbtn.small { flex: none; }
.mid .knobs { grid-template-columns: repeat(2, 1fr); gap: 4px 6px; justify-items: center; }
.mid .knob { width: 42px; height: 42px; }
.mid .kname { font-size: 10.5px; min-height: 13px; font-variant-numeric: tabular-nums; }
.mid .seg button { height: 30px; padding: 0 8px; font-size: 11.5px; max-width: 104px; }
.mid .fbtn.small { height: 30px; padding: 0 8px; font-size: 11.5px; }
.bank { flex: 1; min-height: 164px; display: grid; grid-template-columns: repeat(8, 1fr) 1.25fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 6px; }
.chan { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.chan.master { border-left: 1px solid var(--line); padding-left: 4px; }
.chan .lbl { height: 24px; font-size: 9.5px; line-height: 1.2; color: var(--muted); text-align: center; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; max-width: 100%; word-break: break-word; }
.chan.focus .lbl { color: var(--text); }
.chan.sel { background: rgba(var(--glow-rgb), .14); box-shadow: 0 0 0 1px var(--glow), 0 0 14px rgba(var(--glow-rgb), .4); border-radius: 10px; }
#select { -webkit-touch-callout: none; touch-action: manipulation; }
.bank.armed .chan:not(.master):not(.empty) .fader { cursor: copy; }
.sm { display: flex; gap: 4px; justify-content: center; }
.sm button { width: 34px; height: 28px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: #0d0818; color: var(--muted); font: 600 12px var(--font-display); letter-spacing: .02em; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sm button:disabled { opacity: .3; cursor: default; }
.sm .bs.on { background: linear-gradient(180deg, #8a4dff, var(--glow-deep)); border-color: var(--glow); color: #fff; box-shadow: 0 0 10px rgba(var(--glow-rgb), .7); }
.sm .bm.on { background: #3a2208; border-color: #ffb347; color: #ffb347; box-shadow: 0 0 10px rgba(255, 179, 71, .55); }
.sm.ghost { visibility: hidden; }
@media (max-width: 599px) { .sm { flex-direction: column; gap: 5px; } .sm button { width: 32px; height: 30px; } 
  html, body { height: auto; min-height: 100%; }
  .bank { flex: none; min-height: 215px; }
  .led-idle { min-height: 64px; }
}
.chan.empty .lbl { color: var(--faint); }
.fader { position: relative; flex: 1; width: 100%; min-height: 80px; touch-action: none; cursor: pointer; }
.ftrack { position: absolute; left: 50%; top: 9px; bottom: 9px; width: 6px; transform: translateX(-50%); border-radius: 3px; background: #000; border: 1px solid #2a2142; box-sizing: border-box; }
.ffill { position: absolute; left: 50%; bottom: 9px; width: 4px; transform: translateX(-50%); border-radius: 2px; background: var(--glow); box-shadow: 0 0 8px rgba(var(--glow-rgb), .9); }
.fthumb { position: absolute; left: 50%; width: 30px; height: 18px; transform: translateX(-50%); border-radius: 5px; background: linear-gradient(180deg, #3a3057, #1b1530); border: 1px solid #4a3d70; box-sizing: border-box; }
.fthumb::after { content: ""; position: absolute; left: 5px; right: 5px; top: 50%; height: 2px; margin-top: -1px; background: var(--text); border-radius: 1px; }
.chan.focus .fthumb { border-color: var(--glow); box-shadow: 0 0 10px rgba(var(--glow-rgb), .6); }
.chan.off .ffill { background: #3a3057; box-shadow: none; }
.chan.empty .fader { opacity: .35; pointer-events: none; }
.chan.empty .ffill { display: none; }
.kb-wrap { flex: none; height: 150px; display: flex; gap: 8px; }
.wheels { flex: none; display: flex; gap: 6px; }
.wheel { position: relative; width: 44px; border-radius: 12px; background: #000; border: 1px solid var(--line); touch-action: none; cursor: ns-resize; overflow: hidden; user-select: none; -webkit-user-select: none; }
.wheel .wl { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: .1em; color: var(--muted); pointer-events: none; font-family: var(--font-display); }

.white { flex: 1; min-width: 0; font-size: 10px; background: linear-gradient(180deg, var(--key-white-top), var(--key-white-bot)); border-right: 1px solid #07050c; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; box-sizing: border-box; color: var(--muted); font-size: 11px; font-family: var(--font-display); }

<script>

  const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 2);
  const $ = id => document.getElementById(id);

  let savedT = 0;
  function flashSaved() {
    const el = $('saved');
    if (!el) return;
    el.classList.add('show');
    clearTimeout(savedT);
    savedT = setTimeout(() => el.classList.remove('show'), 1100);
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('psb.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('psb.' + k, JSON.stringify(v)); flashSaved(); } catch (e) {} }
  };

  /* ---------- native sound engine (inside the DAW plugin): the plugin makes the sound, this page controls it ---------- */
  var NAT = { on: false, fromHost: false, have: new Set(), snapT: 0, last: '', _res: null, emb: false };

  NAT.give = async ch => {   // hand a sound's recordings to the plugin (it keeps them on this computer after the first time)
    if (NAT.have.has(ch.id) || !ch.samples) return;
    const keys = Object.keys(ch.samples);
    for (const k of keys) { NAT.emit({ k: 'snd', id: ch.id, key: +k, d: ch.samples[k] }); await new Promise(r => setTimeout(r, 0)); }

  const limFix = ctx.createGain(); limFix.gain.value = 1 / Math.pow(1 / Math.pow(10, (-3 + 3 / 20) / 20), 0.6);

    { f: 60,    type: 'lowshelf',  q: 0.7 },
    { f: 250,   type: 'peaking',   q: 0.9 },
    { f: 1000,  type: 'peaking',   q: 0.9 },
    { f: 4000,  type: 'peaking',   q: 0.9 },

      if (j.build && j.build !== BUILD) {
        const api = window.purpleSoundBank;
        const playing = api && api.active && api.active.size > 0;
        if (!playing) location.reload();
      }
    } catch (e) {}
  }
  setInterval(check, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
</script>

<script>
/* Fit the whole page to the screen height (runs only on load, resize and mode switches, never while playing) */
(function(){
  var t=null;
  function fit(){
    var b=document.body, z=parseFloat(b.style.zoom)||1;
    var natural=document.documentElement.scrollHeight/z, vh=window.innerHeight;
    var target = natural>vh+2 ? Math.max(0.55, Math.floor(vh/natural*1000)/1000) : 1;
    if(Math.abs(target-z)>0.004) b.style.zoom=target;
  }
  function soon(){ clearTimeout(t); t=setTimeout(fit,120); }
  window.addEventListener('resize',soon); window.addEventListener('load',soon);
  var mid=document.querySelector('.mid'); if(mid) new MutationObserver(soon).observe(mid,{attributes:true,attributeFilter:['class']});
  setTimeout(fit,300); setTimeout(fit,1500);
})();

<script>
(function(){
  if (window.__psbIO) return; window.__psbIO = 1;
  var $ = function (i) { return document.getElementById(i); };
  function b64u(buf){ var bin=''; for (var i=0;i<buf.length;i++) bin+=String.fromCharCode(buf[i]); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s), out=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
  async function pipe(bytes, stream){ var w=stream.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); }
  async function enc(obj){ return 'PSB1.' + b64u(await pipe(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('deflate-raw'))); }
  async function dec(txt){ var m=/PSB1\.([A-Za-z0-9_-]+)/.exec(txt||''); if(!m) throw 0; var o=JSON.parse(new TextDecoder().decode(await pipe(unb64u(m[1]), new DecompressionStream('deflate-raw')))); if(!o||typeof o.id!=='string'||!o.data) throw 0; return o; }
  function readSongs(){ try{ return JSON.parse(localStorage.getItem('psb.songs')||'[]'); }catch(e){ return []; } }
  function addSong(s){
    if (typeof window.__psbImportSong === 'function') { window.__psbImportSong(s); return; }
    var songs = readSongs().filter(function(x){ return x.id !== s.id; }); songs.push(s);
    localStorage.setItem('psb.songs', JSON.stringify(songs)); localStorage.setItem('psb.curSong', JSON.stringify(s.id));
    sessionStorage.setItem('psb.pend', String(songs.length-1)); location.reload();
  }
  function flash(b, t, back){ b.textContent = t; setTimeout(function(){ b.textContent = back; }, 1800); }
  function mk(id, text){ var b=document.createElement('button'); b.className='fbtn'; b.id=id; b.type='button'; b.style.gridColumn='1/-1'; b.textContent=text; return b; }
  var st=document.createElement('style'); st.textContent='.mid:not(.isperf) #copyurl, .mid:not(.isperf) #pasteurl{display:none}'; document.head.appendChild(st);
  var sv=$('saveas'); if(!sv) return;
  var old=$('copyurl'); if(old) old.remove(); old=$('pasteurl'); if(old) old.remove();
  var c=mk('copyurl','Copy link'), p=mk('pasteurl','Paste link'); sv.after(c); c.after(p);
  c.addEventListener('click', async function(){
    var cur=null; try{ cur=JSON.parse(localStorage.getItem('psb.curSong')); }catch(e){}
    var s=readSongs().filter(function(x){ return x.id===cur; })[0]; if(!s){ flash(c,'Select a song first','Copy link'); return; }
    var code=await enc(s);
    try{ await navigator.clipboard.writeText(code); flash(c,'Copied ✓','Copy link'); }
    catch(e){ prompt('Copy this link', code); }
  });
  p.addEventListener('click', async function(){
    var txt=''; try{ txt=await navigator.clipboard.readText(); }catch(e){}
    if(!/PSB1\./.test(txt)) txt = prompt('Paste the song link here') || '';
    if(!txt) return;
    try{ addSong(await dec(txt)); flash(p,'Added ✓','Paste link'); }catch(e){ flash(p,'Not a valid link','Paste link'); }
  });
  var pend=null; try{ pend=sessionStorage.getItem('psb.pend'); sessionStorage.removeItem('psb.pend'); }catch(e){}
  if(pend!==null){ var n=0, iv=setInterval(function(){ try{ var pb=$('m-perf'); if(pb && !pb.classList.contains('on')) pb.click(); var rows=document.querySelectorAll('.song'); if(rows[+pend]){ rows[+pend].click(); clearInterval(iv); } }catch(e){} if(++n>40) clearInterval(iv); },300); }
})();

// Warning when all 8 sounds are active at once
(function(){
  var was=false, t=null;
  function count(){ return document.querySelectorAll('#pads .pad.on').length; }
  function show(){
    var old=document.getElementById('psbWarn'); if(old) old.remove();
    var d=document.createElement('div'); d.id='psbWarn'; d.setAttribute('role','alert');
    d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;max-width:560px;width:calc(100% - 32px);background:#1a0f2e;border:1px solid #8b3dff;color:#fff;border-radius:12px;padding:14px 16px;font:14px/1.45 Inter,system-ui,sans-serif;box-shadow:0 8px 40px rgba(139,61,255,.45)';
    d.innerHTML='<b style="display:block;margin-bottom:4px">Be advised: all 8 sounds are playing at once</b>That can overload your output and cause distortion, and at high volume it can harm your speakers or your hearing. Lower the faders or the master volume, or use fewer sounds.<div style="margin-top:10px"><button type="button" style="background:#8b3dff;border:0;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit">Got it</button></div>';
    d.querySelector('button').onclick=function(){ d.remove(); };
    document.body.appendChild(d); clearTimeout(t); t=setTimeout(function(){ d.remove(); },12000);
  }
  function check(){ var n=count(); if(n>=8 && !was){ was=true; show(); } else if(n<8){ was=false; } }
  var pads=document.getElementById('pads'); if(!pads) return;
  new MutationObserver(check).observe(pads,{subtree:true,childList:true,attributes:true,attributeFilter:['class']}); check();
})();
</script>
